[project]
name = "f19"
version = "0.1.0"
description = "Mission planner, autopilot and HUD for F-19 Stealth Fighter under DOSBox-X"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]
# research/ only: notebooks, the pyghidra drivers, the x86 disassembler helper
research = ["notebook>=7.5.0", "pyghidra", "capstone"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running (full planner runs)"]
